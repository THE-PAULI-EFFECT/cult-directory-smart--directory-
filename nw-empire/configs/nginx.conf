# Copy this to /etc/nginx/sites-available/nw-empire
# Then: ln -s /etc/nginx/sites-available/nw-empire /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name wa-portapotty.com www.wa-portapotty.com _;

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static assets - long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # PocketBase API
    location /pb/api/ {
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # PocketBase Admin (restrict to local/VPN in production)
    location /_pb/ {
        allow 127.0.0.1;
        # allow YOUR_IP_HERE;
        deny all;
        proxy_pass http://127.0.0.1:8090/_/;
    }
}
